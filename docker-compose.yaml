name: siklo

services:
  postgres:
    image: postgres:16-alpine
    container_name: siklo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siklo
      POSTGRES_PASSWORD: softwaredev
      POSTGRES_DB: siklo_dev
    ports:
      - "5433:5432"
    volumes:
      - siklo_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.4.6-alpine
    container_name: siklo-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  siklo_pgdata:
